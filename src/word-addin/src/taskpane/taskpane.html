<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OECD Style Checker</title>

  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1 class="header-title">OECD Style Checker</h1>
        <span id="status-badge" class="badge badge-idle">Idle</span>
      </div>
      <p class="header-subtitle">Real-time style guide compliance</p>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="btn-row">
        <button id="btn-check-selection" class="btn btn-primary">
          <span class="btn-icon">&#x2714;</span> Check Selection
        </button>
        <button id="btn-check-all" class="btn btn-outline">
          <span class="btn-icon">&#x1F50D;</span> Full Document
        </button>
      </div>
      <div class="btn-row">
        <button id="btn-clear" class="btn btn-secondary">
          <span class="btn-icon">&#x2715;</span> Clear
        </button>
      </div>
      <div class="toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="chk-realtime" checked />
          <span>Real-time mode</span>
        </label>
      </div>
    </div>

    <!-- Summary bar -->
    <div id="summary-bar" class="summary-bar hidden">
      <span id="summary-total" class="summary-item"></span>
      <span id="summary-mandatory" class="summary-item severity-mandatory"></span>
      <span id="summary-recommended" class="summary-item severity-recommended"></span>
    </div>

    <!-- Findings list -->
    <div id="findings-container" class="findings-container">
      <div id="empty-state" class="empty-state">
        <p>No findings yet.</p>
        <p class="hint">Click <strong>Check Document</strong> or enable <strong>Real-time mode</strong> to start.</p>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Checking...</p>
    </div>
  </div>
</body>
</html>
