# ==============================================================================
# Azure DevOps pipeline — Applications (ACR build + ACA update)
# ------------------------------------------------------------------------------
# What it does:
#   1. Build & push 3 images via `az acr build` (runs inside Azure → no public
#      ACR access needed; works even when the ACR has publicNetworkAccess=Disabled)
#   2. Roll the new image into each Container App / Job via `az containerapp update`
#      (no bicep re-deploy — guarantees a new revision every run)
#   3. (Optional) Smoke-test by triggering the pdf-pipeline job
#
# Triggers:
#   - Push to main that touches src/**
#   - Manual run from the ADO UI
# ==============================================================================

name: apps-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - .azure-pipelines/apps-deploy.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Variable group `aiquality-dev` provides:
  #   azureSubscriptionConnection, resourceGroupName, acrName,
  #   pdfPipelineJobName (default: job-pdf-pipeline)
  - group: aiquality-dev
  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: BuildAndPush
    displayName: Build + push images (az acr build)
    jobs:
      - job: build
        displayName: ACR build matrix
        strategy:
          matrix:
            quality-api:
              imageName: quality-api
              dockerfile: src/api/Dockerfile
              context: src
            pdf-pipeline:
              imageName: pdf-pipeline
              dockerfile: src/pdf_pipeline/Dockerfile
              context: src
            word-addin:
              imageName: word-addin
              dockerfile: src/word-addin/Dockerfile
              context: src/word-addin
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: az acr build $(imageName)
            inputs:
              azureSubscription: $(azureSubscriptionConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageName):$(imageTag)" \
                  --image "$(imageName):latest" \
                  --file "$(dockerfile)" \
                  "$(context)"

  - stage: DeployApps
    displayName: Roll new image tag into ACAs
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: rollout
        displayName: az containerapp update
        environment: aiquality-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Update quality-api + word-addin + pdf-pipeline job
                  inputs:
                    azureSubscription: $(azureSubscriptionConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      RG="$(resourceGroupName)"
                      ACR_LOGIN_SERVER="$(acrName).azurecr.io"
                      TAG="$(imageTag)"
                      SUFFIX="b${TAG}"

                      echo "==> ca-quality-api → quality-api:${TAG}"
                      az containerapp update \
                        -g "$RG" -n ca-quality-api \
                        --image "${ACR_LOGIN_SERVER}/quality-api:${TAG}" \
                        --revision-suffix "$SUFFIX" \
                        -o table

                      echo "==> ca-word-addin → word-addin:${TAG}"
                      az containerapp update \
                        -g "$RG" -n ca-word-addin \
                        --image "${ACR_LOGIN_SERVER}/word-addin:${TAG}" \
                        --revision-suffix "$SUFFIX" \
                        -o table

                      echo "==> $(pdfPipelineJobName) → pdf-pipeline:${TAG}"
                      az containerapp job update \
                        -g "$RG" -n "$(pdfPipelineJobName)" \
                        --image "${ACR_LOGIN_SERVER}/pdf-pipeline:${TAG}" \
                        -o table

  # Optional smoke test — comment out to disable
  - stage: SmokeTestPipelineJob
    displayName: Trigger pdf-pipeline job (smoke test)
    dependsOn: DeployApps
    condition: succeeded()
    jobs:
      - job: trigger
        displayName: az containerapp job start
        steps:
          - task: AzureCLI@2
            displayName: Start job execution
            inputs:
              azureSubscription: $(azureSubscriptionConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                EXEC_NAME=$(az containerapp job start \
                  -g "$(resourceGroupName)" \
                  -n "$(pdfPipelineJobName)" \
                  --query "name" -o tsv)
                echo "Started execution: $EXEC_NAME"
                echo "##vso[task.setvariable variable=executionName]$EXEC_NAME"

          - task: AzureCLI@2
            displayName: Show execution status (non-blocking)
            inputs:
              azureSubscription: $(azureSubscriptionConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp job execution show \
                  -g "$(resourceGroupName)" \
                  -n "$(pdfPipelineJobName)" \
                  --job-execution-name "$(executionName)" \
                  --query "{name:name, status:properties.status, startTime:properties.startTime}" \
                  -o table
                echo "Tail logs with:"
                echo "  az containerapp job logs show -g $(resourceGroupName) -n $(pdfPipelineJobName) --execution $(executionName) --follow"
